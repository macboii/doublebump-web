<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting to the App Store — DoubleBump</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BP8MZZ3QJE"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    // Automatic page_view has no send guarantee before we redirect — send it
    // ourselves below, gated the same way as store_redirect.
    gtag('config', 'G-BP8MZZ3QJE', { send_page_view: false });
  </script>

  <noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/id6770075271" /></noscript>
</head>
<body>
Redirecting to the App Store&hellip;
<script>
  // Cold-outreach tracking redirect: doublebump.com/ios?utm_... fires a GA4
  // store_redirect event, then forwards to the real App Store listing.
  // This measures the click, not an install — iOS has no install-referrer
  // equivalent to Android's, so don't treat this as install attribution.
  var DEST = 'https://apps.apple.com/app/id6770075271';

  var params = new URLSearchParams(location.search);
  var eventParams = { platform: 'ios' };
  ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content'].forEach(function (key) {
    var val = params.get(key);
    if (val) eventParams[key] = val;
  });

  var redirected = false;
  function goToStore() {
    if (redirected) return;
    redirected = true;
    location.href = DEST;
  }

  // Session campaign attribution comes from page_view, not store_redirect —
  // both must land before we leave, or a fast redirect can outrun gtag.js's
  // async load and the session never gets the UTM values.
  var pending = 0;
  function hitDone() { if (--pending <= 0) goToStore(); }

  if (typeof gtag === 'function') {
    pending = 2;
    gtag('event', 'page_view', Object.assign({
      page_location: location.href,
      page_title: document.title,
      event_callback: hitDone
    }, eventParams));

    var redirectParams = Object.assign({}, eventParams);
    redirectParams.event_callback = hitDone;
    gtag('event', 'store_redirect', redirectParams);
  }
  // Never let a blocked/slow/missing GA hit (ad blockers, offline gtag.js)
  // strand the visitor on this page — always land on the Store.
  setTimeout(goToStore, 800);
</script>
</body>
</html>
